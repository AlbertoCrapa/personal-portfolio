<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="motionOverlayTitle">
<title id="motionOverlayTitle">Motion Overlay — real-time face and hand tracking with webcam icon overlays</title>
<defs>
<linearGradient id="moWash" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#222222"/>
<stop offset="0.55" stop-color="#191919"/>
<stop offset="1" stop-color="#111111"/>
</linearGradient>
<radialGradient id="moGlowBlue" cx="0.32" cy="0.4" r="0.5">
<stop offset="0" stop-color="#4285f4" stop-opacity="0.20"/>
<stop offset="1" stop-color="#4285f4" stop-opacity="0"/>
</radialGradient>
<radialGradient id="moGlowPurple" cx="0.72" cy="0.55" r="0.46">
<stop offset="0" stop-color="#9b84e7" stop-opacity="0.18"/>
<stop offset="1" stop-color="#9b84e7" stop-opacity="0"/>
</radialGradient>
<pattern id="moHatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="18" stroke="#ffffff" stroke-opacity="0.03" stroke-width="7"/>
</pattern>
</defs>

<rect width="1600" height="900" fill="url(#moWash)"/>
<rect width="1600" height="900" fill="url(#moHatch)"/>
<rect width="1600" height="900" fill="url(#moGlowBlue)"/>
<rect width="1600" height="900" fill="url(#moGlowPurple)"/>

<!-- face: outline + tracked landmark points, echoing a face-mesh readout -->
<g transform="translate(560,380)">
  <ellipse cx="0" cy="0" rx="118" ry="146" stroke="#4285f4" stroke-opacity="0.85" stroke-width="4"/>
  <path d="M-70 -40 Q0 -84 70 -40" stroke="#4285f4" stroke-opacity="0.55" stroke-width="3" fill="none"/>
  <path d="M-46 92 Q0 122 46 92" stroke="#4285f4" stroke-opacity="0.55" stroke-width="3" fill="none"/>
  <g fill="#4285f4">
    <circle cx="-46" cy="-18" r="6"/>
    <circle cx="46" cy="-18" r="6"/>
    <circle cx="0" cy="14" r="6"/>
    <circle cx="-34" cy="60" r="5"/>
    <circle cx="34" cy="60" r="5"/>
    <circle cx="0" cy="76" r="5"/>
    <circle cx="-84" cy="-4" r="5"/>
    <circle cx="84" cy="-4" r="5"/>
    <circle cx="0" cy="-104" r="5"/>
    <circle cx="0" cy="118" r="5"/>
  </g>
  <g stroke="#4285f4" stroke-opacity="0.4" stroke-width="1.5">
    <line x1="-46" y1="-18" x2="0" y2="14"/>
    <line x1="46" y1="-18" x2="0" y2="14"/>
    <line x1="-34" y1="60" x2="0" y2="76"/>
    <line x1="34" y1="60" x2="0" y2="76"/>
  </g>
</g>

<!-- hand: simple open-palm silhouette + fingertip/joint landmarks -->
<g transform="translate(1020,470)" stroke="#9b84e7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M-70 40 C-78 -6 -70 -70 -54 -78 C-42 -84 -32 -74 -32 -58 L-32 -20" stroke-opacity="0.85"/>
  <path d="M-32 -58 L-32 -104 C-32 -118 -12 -118 -12 -104 L-12 -50" stroke-opacity="0.85"/>
  <path d="M-12 -104 L-10 -134 C-10 -148 10 -148 10 -134 L10 -48" stroke-opacity="0.85"/>
  <path d="M10 -134 L14 -118 C14 -132 34 -132 34 -118 L34 -44" stroke-opacity="0.85"/>
  <path d="M34 -80 C50 -84 62 -70 62 -54 L62 4" stroke-opacity="0.85"/>
  <path d="M-70 40 C-70 84 -46 118 4 118 C46 118 66 92 66 54 L62 4" stroke-opacity="0.85"/>
  <g fill="#9b84e7" stroke="none">
    <circle cx="-54" cy="-78" r="5"/>
    <circle cx="-12" cy="-104" r="5"/>
    <circle cx="10" cy="-134" r="5"/>
    <circle cx="34" cy="-118" r="5"/>
    <circle cx="62" cy="-54" r="5"/>
    <circle cx="4" cy="10" r="5"/>
  </g>
  <g stroke-opacity="0.35" stroke-width="1.5">
    <line x1="-54" y1="-78" x2="4" y2="10"/>
    <line x1="-12" y1="-104" x2="4" y2="10"/>
    <line x1="10" y1="-134" x2="4" y2="10"/>
    <line x1="34" y1="-118" x2="4" y2="10"/>
    <line x1="62" y1="-54" x2="4" y2="10"/>
  </g>
</g>

<text x="800" y="720" text-anchor="middle" font-family="'Space Grotesk', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="600" letter-spacing="14" fill="#ffffff">MOTION OVERLAY</text>
<text x="800" y="764" text-anchor="middle" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#a0a0a0">Real-time face &amp; hand tracking, entirely in the browser</text>
</svg>
