    <!--
      DM Sans is the UI font (top bar, body). It is self-hosted and preloaded so
      it is available before first paint. Loading it from fonts.googleapis.com
      meant the @font-face rule itself landed after React had already painted the
      nav in a fallback face, and the later swap re-measured every glyph and
      shifted the fixed top bar by a few px on every load.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="%PUBLIC_URL%/font/dm-sans-latin.woff2"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;900&family=Lora:ital,wght@1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Loading with display=swap for better performance -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@200,300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom Font Face -->
    <style>
      /* Self-hosted DM Sans (variable, wght 100–1000). font-display: optional so
         a slow font can never swap in after paint and reflow the layout. */
      @font-face {
        font-family: "DM Sans";
        src: url("%PUBLIC_URL%/font/dm-sans-latin.woff2") format("woff2");
        font-weight: 100 1000;
        font-style: normal;
        font-display: optional;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("%PUBLIC_URL%/font/dm-sans-latin-ext.woff2") format("woff2");
        font-weight: 100 1000;
        font-style: normal;
        font-display: optional;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("%PUBLIC_URL%/font/dm-sans-italic-latin.woff2") format("woff2");
        font-weight: 100 1000;
        font-style: italic;
        font-display: optional;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("%PUBLIC_URL%/font/dm-sans-italic-latin-ext.woff2")
          format("woff2");
        font-weight: 100 1000;
        font-style: italic;
        font-display: optional;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7,
          U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
          U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
          U+A720-A7FF;
      }

      @font-face {
        font-family: "MiniMochi";
        src: url("%PUBLIC_URL%/font/MiniMochi.woff") format("woff");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      /* Reserve the fixed top bar before React boots, so nothing pops in. */
      #nav-skeleton {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        z-index: 40;
        background: #111111;
        border-bottom: 1px solid #313131;
      }
      body:has(#root > *) #nav-skeleton {
        display: none;
      }
    </style>
